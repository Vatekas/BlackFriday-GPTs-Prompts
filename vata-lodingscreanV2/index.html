<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunaX Loading Screen</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include a modern font like Poppins as per preferences -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-overlay"></div>

    <div class="header">
        <div class="logo-container">
            <img src="assets/logo.png" alt="LunaX Logo" class="logo">
        </div>
        <div class="header-buttons">
            <a href="https://lunax.lt/" class="header-btn website-btn" target="_blank">
                <i class="fas fa-globe"></i> SVETAINĖ
            </a>
            <a href="https://discord.gg/rkh2We4dwb" class="header-btn discord-btn" target="_blank">
                <i class="fab fa-discord"></i> DISCORD
            </a>
        </div>
    </div>

    <div class="main-content">
        <div class="server-info">
            <h1 class="title">SVEIKI ATVYKĘ Į <span class="highlight">LUNAX</span></h1>
            <p class="subtitle">MĖGAUKITĖS ŽAIDIMU MŪSŲ SERVERYJE</p>
        </div>
    </div>

    <div class="footer">
        <div class="did-you-know">
            <img src="assets/icon.png" alt="Did you know icon" class="dyk-icon">
            <div class="dyk-text-container">
                <span class="dyk-title">AR ŽINOJOTE KAD?</span>
                <span class="dyk-fact">LunaX bendruomenė yra viena iš aktyviausių ir draugiškiausių žaidėjų! Prisijunkite prie mūsų Discord.</span>
            </div>
        </div>
    </div>

</body>
</html>
