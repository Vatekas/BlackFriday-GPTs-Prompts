<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vata-Phone Setup</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="phone-container" class="hidden">
        <div class="phone-hardware">
            <!-- Hardware Buttons -->
            <div class="button button-left mute-btn"></div>
            <div class="button button-left vol-up-btn"></div>
            <div class="button button-left vol-down-btn"></div>
            <div class="button button-right power-btn"></div>

            <div class="iphone-frame">
                <div class="screen">
                    <!-- Status Bar -->
                    <div class="status-bar">
                        <div class="time">19:46</div>
                        <div class="dynamic-island">
                            <div class="camera-dot"></div>
                        </div>
                        <div class="status-icons">
                            <svg class="icon-signal" viewBox="0 0 18 12" width="18" height="12">
                                <rect x="0" y="8" width="3" height="4" rx="1.5" fill="currentColor"/>
                                <rect x="5" y="5.5" width="3" height="6.5" rx="1.5" fill="currentColor"/>
                                <rect x="10" y="3" width="3" height="9" rx="1.5" fill="currentColor"/>
                                <rect x="15" y="0" width="3" height="12" rx="1.5" fill="currentColor"/>
                            </svg>
                            <svg class="icon-wifi" viewBox="0 0 18 12" width="18" height="12">
                                <path d="M9 12a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6zm0-5c2 0 3.8.7 5.2 1.9l1.2-1.2A8.8 8.8 0 0 0 9 5.5a8.8 8.8 0 0 0-6.4 2.2l1.2 1.2A6.8 6.8 0 0 1 9 7zm0-3.2c3.4 0 6.4 1.3 8.7 3.4l1.2-1.2A13.8 13.8 0 0 0 9 2.5a13.8 13.8 0 0 0-9.9 3.5l1.2 1.2A11.8 11.8 0 0 1 9 3.8z" fill="currentColor"/>
                            </svg>
                            <div class="ios-battery">
                                <span>100</span>
                            </div>
                        </div>
                    </div>

                    <!-- Setup Screens Container -->
                    <div id="setup-container" class="screen-view">

                        <!-- Step 1: Language -->
                        <div id="setup-step-1" class="setup-step">
                            <div class="logo-container">
                                <div class="lunax-logo">LUNA<span class="blue-x">X</span></div>
                            </div>

                            <div class="setup-header">
                                <div class="subtitle-container">
                                    <i class="fa-solid fa-globe"></i>
                                    <p>Pasirinkite kalbą</p>
                                </div>
                            </div>

                            <div class="language-list">
                                <button class="lang-btn" id="lang-lt-btn">
                                    <div class="lang-info">Lietuvių</div>
                                    <i class="fa-solid fa-chevron-right"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Step 2: PIN Code -->
                        <div id="setup-step-2" class="setup-step hidden">
                            <div class="setup-header">
                                <h2>Sukurti PIN kodą</h2>
                                <p class="pin-subtitle">Įveskite 4 skaitmenų kodą</p>
                            </div>

                            <div class="pin-display">
                                <div class="pin-dot"></div>
                                <div class="pin-dot"></div>
                                <div class="pin-dot"></div>
                                <div class="pin-dot"></div>
                            </div>

                            <div class="keypad">
                                <button class="keypad-btn">1</button>
                                <button class="keypad-btn">2</button>
                                <button class="keypad-btn">3</button>
                                <button class="keypad-btn">4</button>
                                <button class="keypad-btn">5</button>
                                <button class="keypad-btn">6</button>
                                <button class="keypad-btn">7</button>
                                <button class="keypad-btn">8</button>
                                <button class="keypad-btn">9</button>
                                <button class="keypad-btn empty"></button>
                                <button class="keypad-btn">0</button>
                                <button class="keypad-btn delete"><i class="fa-solid fa-delete-left"></i></button>
                            </div>
                        </div>

                        <!-- Step 3: Theme -->
                        <div id="setup-step-3" class="setup-step hidden">
                            <div class="setup-header">
                                <h2>Išvaizda</h2>
                                <p class="pin-subtitle">Pasirinkite telefono temą</p>
                            </div>

                            <div class="theme-selection">
                                <div class="theme-option" data-theme="light">
                                    <div class="theme-preview light-preview"></div>
                                    <span>Šviesi</span>
                                </div>
                                <div class="theme-option" data-theme="dark">
                                    <div class="theme-preview dark-preview"></div>
                                    <span>Tamsi</span>
                                </div>
                            </div>

                            <button id="finish-setup-btn" class="primary-btn hidden">Baigti Setup</button>
                        </div>

                    </div>

                    <!-- Home Screen -->
                    <div id="home-screen" class="screen-view hidden">
                        <div class="app-grid">
                            <div class="app-icon" id="phone-app-btn">
                                <div class="icon-bg phone-bg">
                                    <i class="fa-solid fa-phone"></i>
                                </div>
                                <span>Phone</span>
                            </div>
                        </div>

                        <div class="dock">
                            <!-- Dock apps can go here -->
                        </div>
                    </div>

                    <!-- Phone App Screen -->
                    <div id="phone-app-screen" class="screen-view hidden" style="background-color: white;">
                        <div class="phone-app-header">
                            <h2>Kontaktai</h2>
                        </div>

                        <div class="my-card">
                            <div class="avatar">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <div class="my-info">
                                <h3 id="my-name">John Doe</h3>
                                <p id="my-number">Dalintis numeriu</p>
                            </div>
                        </div>

                        <div class="share-number-btn" id="share-number-btn">
                            <i class="fa-solid fa-share-nodes"></i>
                            <span>Share Number</span>
                        </div>
                    </div>

                    <!-- Call Screen -->
                    <div id="call-screen" class="screen-view hidden" style="background-color: #1c1c1e;">
                        <div class="call-info">
                            <div class="caller-avatar">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <h2 id="caller-name">Unknown</h2>
                            <p id="call-status">Skambina...</p>
                        </div>

                        <div class="call-actions">
                            <button id="end-call-btn" class="call-btn end-btn"><i class="fa-solid fa-phone-slash"></i></button>
                            <button id="answer-call-btn" class="call-btn answer-btn"><i class="fa-solid fa-phone"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
