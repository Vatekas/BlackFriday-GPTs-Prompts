<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vata-Phone Setup</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="phone-container" class="hidden">
        <div class="phone-hardware">
            <!-- Hardware Buttons -->
            <div class="button button-left mute-btn"></div>
            <div class="button button-left vol-up-btn"></div>
            <div class="button button-left vol-down-btn"></div>
            <div class="button button-right power-btn"></div>

            <div class="iphone-frame">
                <div class="screen">
                    <!-- Status Bar -->
                    <div class="status-bar">
                        <div class="time">19:46</div>
                        <div class="dynamic-island">
                            <div class="camera-dot"></div>
                        </div>
                        <div class="status-icons">
                            <svg class="icon-signal" viewBox="0 0 16 12" width="16" height="12">
                                <rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/>
                                <rect x="4.33" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/>
                                <rect x="8.66" y="3" width="3" height="9" rx="1" fill="currentColor"/>
                                <rect x="13" y="0" width="3" height="12" rx="1" fill="currentColor"/>
                            </svg>
                            <svg class="icon-wifi" viewBox="0 0 16 12" width="16" height="12">
                                <path d="M8 12a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm0-4.5c1.8 0 3.5.7 4.8 1.9l1.1-1.1A8.2 8.2 0 0 0 8 6a8.2 8.2 0 0 0-5.9 2.3L3.2 9.4A6.7 6.7 0 0 1 8 7.5zm0-3c3 0 5.8 1.2 7.9 3.2l1-1A12.7 12.7 0 0 0 8 3a12.7 12.7 0 0 0-8.9 3.7l1.1 1A11.2 11.2 0 0 1 8 4.5z" fill="currentColor"/>
                            </svg>
                            <div class="ios-battery">
                                <span>100</span>
                            </div>
                        </div>
                    </div>

                    <!-- Setup Screen -->
                    <div id="setup-screen" class="screen-view">
                        <div class="logo-container">
                            <div class="lunax-logo">LUNA<span class="blue-x">X</span></div>
                        </div>

                        <div class="setup-header">
                            <div class="subtitle-container">
                                <i class="fa-solid fa-globe"></i>
                                <p>Pasirinkite kalbą</p>
                            </div>
                        </div>

                        <div class="language-list">
                            <button class="lang-btn" data-lang="lt">
                                <div class="lang-info">Lietuvių</div>
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="home-indicator"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
