<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vata-Phone Setup</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="phone-container" class="hidden">
        <div class="phone-hardware">
            <!-- Hardware Buttons -->
            <div class="button button-left mute-btn"></div>
            <div class="button button-left vol-up-btn"></div>
            <div class="button button-left vol-down-btn"></div>
            <div class="button button-right power-btn"></div>

            <div class="iphone-frame">
                <div class="screen">
                    <!-- Status Bar -->
                    <div class="status-bar">
                        <div class="time">19:46</div>
                        <div class="dynamic-island">
                            <div class="camera-dot"></div>
                        </div>
                        <div class="status-icons">
                            <i class="fa-solid fa-signal"></i>
                            <i class="fa-solid fa-wifi"></i>
                            <i class="fa-solid fa-battery-full"></i>
                        </div>
                    </div>

                    <!-- Setup Screen -->
                    <div id="setup-screen" class="screen-view">
                        <div class="logo-container">
                            <div class="lunax-logo">LUNA<span class="blue-x">X</span></div>
                        </div>

                        <div class="setup-header">
                            <h1>Sveiki</h1>
                            <div class="subtitle-container">
                                <i class="fa-solid fa-globe"></i>
                                <p>Pasirinkite kalbą</p>
                            </div>
                        </div>

                        <div class="language-list">
                            <button class="lang-btn" data-lang="lt">
                                <div class="lang-info">Lietuvių</div>
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="home-indicator"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
