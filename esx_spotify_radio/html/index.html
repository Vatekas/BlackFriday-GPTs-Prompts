<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Radio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="main-container">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <i class="fa-solid fa-list-ul"></i>
                    <h2>Mano sąrašai</h2>
                    <i class="fa-solid fa-plus add-playlist-btn"></i>
                </div>
                <div class="playlists" id="saved-songs-list">
                    <!-- Saved songs will be populated here -->
                </div>
            </div>

            <!-- Main Content -->
            <div class="content">
                <div class="top-bar">
                    <div class="nav-arrows">
                        <i class="fa-solid fa-chevron-left"></i>
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                    <div class="search-bar">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="youtube-url-input" placeholder="Įklijuokite YouTube nuorodą arba ieškokite dainų">
                        <button id="search-btn">Ieškoti / Leisti</button>
                    </div>
                    <div class="user-profile">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>

                <div class="categories-tabs">
                    <button class="active">Visi</button>
                    <button>Patvirtinti</button>
                    <button>Vieši</button>
                    <button>Jūsų sąrašai</button>
                </div>

                <div class="categories-grid">
                    <div class="category-card" style="border-left-color: red;">
                        <i class="fa-solid fa-chart-line"></i> Top Monthly
                    </div>
                    <div class="category-card" style="border-left-color: greenyellow;">
                        <i class="fa-solid fa-chart-bar"></i> Top Weekly
                    </div>
                    <div class="category-card">
                        <div class="mock-img"></div> Dantukas
                    </div>
                    <div class="category-card">
                        <div class="mock-img"></div> Vibas
                    </div>
                    <div class="category-card" style="border-left-color: purple;">
                        <i class="fa-solid fa-music"></i> Muzika
                    </div>
                    <div class="category-card" style="border-left-color: purple;">
                        <i class="fa-solid fa-headphones"></i> Uptempo Best Tempo
                    </div>
                </div>

                <div class="recent-section">
                    <h2>Neseniai grota</h2>
                    <div class="recent-grid" id="recent-songs-container">
                        <!-- Recently played will go here -->
                        <div class="recent-card">
                            <img src="https://via.placeholder.com/150" alt="mock">
                            <h4>Aslan feat...</h4>
                            <p>Bass Boost...</p>
                        </div>
                         <div class="recent-card">
                            <img src="https://via.placeholder.com/150" alt="mock">
                            <h4>Vse Delfiny...</h4>
                            <p>kavenskas</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Player -->
        <div class="player-bar">
            <div class="now-playing">
                <img id="now-playing-img" src="https://via.placeholder.com/60" alt="Cover">
                <div class="track-info">
                    <h4 id="now-playing-title">Nėra grojamos dainos</h4>
                    <p id="now-playing-artist">---</p>
                </div>
                <i class="fa-regular fa-circle-plus save-song-btn" id="save-current-song" title="Išsaugoti"></i>
            </div>

            <div class="player-controls-container">
                <div class="player-controls">
                    <i class="fa-solid fa-shuffle"></i>
                    <i class="fa-solid fa-backward-step" id="prev-btn"></i>
                    <div class="play-pause-btn" id="play-pause-btn">
                        <i class="fa-solid fa-play" id="play-icon"></i>
                    </div>
                    <i class="fa-solid fa-forward-step" id="next-btn"></i>
                    <i class="fa-solid fa-stop" id="stop-btn"></i>
                    <i class="fa-solid fa-repeat"></i>
                </div>
            </div>

            <div class="player-volume">
                <i class="fa-solid fa-microphone"></i>
                <i class="fa-solid fa-list"></i>
                <i class="fa-solid fa-volume-high"></i>
                <input type="range" id="volume-slider" min="0" max="100" value="100">
            </div>
        </div>
        <!-- Close Button overlay -->
        <button id="close-ui-btn"><i class="fa-solid fa-xmark"></i> Esc</button>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
