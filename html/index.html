<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JG HUD</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HUD container on Top Right -->
    <div id="hud-container">
        <!-- Voice Row (Without Profile Avatar) -->
        <div class="hud-row" id="voice-row">
            <!-- Equalizer waves when talking (placed next to card) -->
            <div class="sound-waves" id="sound-waves">
                <span class="wave-bar"></span>
                <span class="wave-bar"></span>
                <span class="wave-bar"></span>
                <span class="wave-bar"></span>
            </div>

            <div class="voice-container glass-card">
                <!-- Voice Level Indicator (Vertical Bar) -->
                <div class="voice-level" id="voice-level">
                    <div class="voice-level-fill" id="voice-level-fill"></div>
                </div>
                <!-- Microphone Icon -->
                <div class="voice-mic-box">
                    <svg id="mic-svg" class="mic-icon muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <!-- Muted state with slash by default -->
                        <path class="mic-body" d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path class="mic-stand" d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>
                        <line class="mic-slash" x1="1" y1="1" x2="23" y2="23" />
                    </svg>
                </div>
            </div>
        </div>

        <!-- ID and Time Row (Side by side) -->
        <div class="hud-row split-row">
            <!-- ID Pill -->
            <div class="hud-pill glass-card shrink" id="id-pill">
                <svg viewBox="0 0 24 24" class="icon-svg-no-bg" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="9" x2="20" y2="9"></line>
                    <line x1="4" y1="15" x2="20" y2="15"></line>
                    <line x1="10" y1="3" x2="8" y2="21"></line>
                    <line x1="16" y1="3" x2="14" y2="21"></line>
                </svg>
                <span id="player-id">1</span>
            </div>
            <!-- Time Pill -->
            <div class="hud-pill glass-card expand-time" id="time-pill">
                <svg viewBox="0 0 24 24" class="icon-svg-no-bg" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span id="server-time">00:00</span>
            </div>
        </div>

        <!-- Job Row -->
        <div class="hud-row">
            <div class="hud-pill glass-card job-pill" id="job-pill">
                <div class="icon-wrapper icon-grey-bg">
                    <svg viewBox="0 0 24 24" class="icon-svg" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                    </svg>
                </div>
                <span id="player-job">Bedarbis</span>
            </div>
        </div>

        <!-- Cash Row (Stacked vertically) -->
        <div class="hud-row">
            <div class="hud-pill glass-card money-pill cash-pill" id="cash-pill">
                <div class="icon-wrapper icon-green">
                    <svg viewBox="0 0 24 24" class="icon-svg" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                        <circle cx="12" cy="12" r="2.5"></circle>
                        <line x1="6" y1="12" x2="6" y2="12.01"></line>
                        <line x1="18" y1="12" x2="18" y2="12.01"></line>
                    </svg>
                </div>
                <span id="player-cash">$0</span>
            </div>
        </div>

        <!-- Bank Row (Stacked vertically) -->
        <div class="hud-row">
            <div class="hud-pill glass-card money-pill bank-pill" id="bank-pill">
                <div class="icon-wrapper icon-blue">
                    <svg viewBox="0 0 24 24" class="icon-svg" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 21h18M3 10h18M3 7l9-4 9 4M5 10v11M9 10v11M15 10v11M19 10v11"></path>
                    </svg>
                </div>
                <span id="player-bank">$0</span>
            </div>
        </div>

        <!-- Dirty Money Row (Stacked vertically, hidden if $0) -->
        <div class="hud-row" id="dirty-money-row">
            <div class="hud-pill glass-card money-pill dirty-pill" id="dirty-pill">
                <div class="icon-wrapper icon-red">
                    <svg viewBox="0 0 24 24" class="icon-svg" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                        <circle cx="12" cy="13" r="4"></circle>
                        <line x1="8" y1="7" x2="8" y2="7.01"></line>
                        <line x1="12" y1="7" x2="12" y2="7.01"></line>
                        <line x1="16" y1="7" x2="16" y2="7.01"></line>
                    </svg>
                </div>
                <span id="player-dirty">$0</span>
            </div>
        </div>
    </div>

    <!-- Location HUD (Bottom-left corner, floats dynamically above minimap) -->
    <div id="location-hud" class="location-hidden">
        <!-- Direction indicator badge (NW, SE, etc.) -->
        <div class="location-badge">
            <span id="loc-direction">N</span>
        </div>
        <!-- Street & Zone details -->
        <div class="location-info">
            <div id="loc-street" class="location-street">Kraunasi...</div>
            <div id="loc-details" class="location-details">Laukiama GPS signalo</div>
        </div>
    </div>

    <!-- Speedometer (Bottom-right corner) -->
    <div id="speedometer" class="speedo-hidden">
        <svg class="speedo-ring" viewBox="0 0 100 100">
            <!-- Nested Solid Gas Pump Icon (Inside SVG for perfect alignment & scale) -->
            <svg id="speedo-fuel-icon" class="speedo-svg-icon" x="19" y="4" width="8" height="8" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19.5 5.5v13c0 .83-.67 1.5-1.5 1.5h-1v-2H10v2H9c-.83 0-1.5-.67-1.5-1.5v-13C7.5 4.67 8.17 4 9 4h8c.83 0 1.5.67 1.5 1.5zM12 9h3V7h-3v2zm6 10.5c0-.28-.22-.5-.5-.5h-7c-.28 0-.5.22-.5.5v.5h8v-.5z"/>
                <path d="M19.5 8.5c1.1 0 2 .9 2 2v2c0 .55-.45 1-1 1s-1-.45-1-1v-2h-2V9.5c0-.55.45-1 1-1s1 .45 1 0z"/>
            </svg>

            <!-- Nested Solid Check Engine Icon (Inside SVG for perfect alignment & scale) -->
            <svg id="speedo-engine-icon" class="speedo-svg-icon" x="73" y="4" width="8" height="8" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 8.5V7a1 1 0 0 0-1-1h-2.5V4.5a1 1 0 0 0-1-1h-3a1 1 0 0 0-1 1V6H8a1 1 0 0 0-1 1v1.5H5.5A1.5 1.5 0 0 0 4 10v4a1.5 1.5 0 0 0 1.5 1.5H7v2a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-2h1.5A1.5 1.5 0 0 0 20 14v-4a1.5 1.5 0 0 0-1-1.5zM18 13.5H6v-3h12v3z"/>
            </svg>

            <!-- Fuel Outer Arc (Left) -->
            <circle class="speedo-outer-track fuel-track" cx="50" cy="50" r="46" />
            <circle id="fuel-fill" class="speedo-outer-fill fuel-fill" cx="50" cy="50" r="46" />

            <!-- Engine Outer Arc (Right) -->
            <circle class="speedo-outer-track engine-track" cx="50" cy="50" r="46" />
            <circle id="engine-fill" class="speedo-outer-fill engine-fill" cx="50" cy="50" r="46" />

            <!-- RPM Circular Track (Center) -->
            <circle class="speedo-track" cx="50" cy="50" r="40" />
            <circle id="rpm-fill" class="speedo-fill" cx="50" cy="50" r="40" />
        </svg>

        <div class="speedo-content">
            <!-- Gear Circle -->
            <div class="speedo-gear-circle">
                <span id="speedo-gear">N</span>
            </div>
            <!-- Speed Value -->
            <div id="speedo-val" class="speedo-speed">0</div>
            <!-- Unit -->
            <div class="speedo-unit">KMH</div>
            <!-- Odometer -->
            <div id="speedo-odo" class="speedo-odometer">000000 KM</div>
        </div>
    </div>

    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
